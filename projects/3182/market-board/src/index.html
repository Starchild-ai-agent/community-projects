<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Market Board — Top 10 Snapshot</title>
<style>
  :root{
    --bg:#0a0d12; --panel:#11161f; --panel2:#161c28; --line:#232b3a;
    --txt:#e8edf5; --dim:#8b96a8; --faint:#5a6478;
    --green:#3ddc97; --red:#ff5a5a; --blue:#5aa7ff; --gold:#f2c14e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}

  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  h1{font-size:26px;letter-spacing:.5px}
  h1 span{color:var(--gold)}
  .sub{color:var(--dim);font-size:14px;margin-top:4px}
  .stamp{font-size:12px;color:var(--faint);text-align:right}
  .stamp b{color:var(--green);font-weight:600}
  .rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:16px 0 24px}

  .sec-title{font-size:13px;color:var(--faint);text-transform:uppercase;letter-spacing:1.5px;margin:26px 0 12px}

  /* Summary strip */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .metric .lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .metric .num{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .metric .note{font-size:12px;color:var(--dim);margin-top:4px}
  .pos{color:var(--green)} .neg{color:var(--red)} .nt{color:var(--dim)}

  /* Coin cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  .card:hover{border-color:#33405a}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .coin-id{display:flex;align-items:center;gap:10px;min-width:0}
  .badge{width:38px;height:38px;flex-shrink:0;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
         display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.5px}
  .coin-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .coin-sym{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:1px}
  .price{text-align:right}
  .price b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
  .price small{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:1px}

  .chg-row{display:flex;gap:8px;flex-wrap:wrap}
  .pill{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
  .pill b{font-weight:600}
  .pill .k{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;margin-right:5px}
  .pill.pos{border-color:rgba(61,220,151,.4)} .pill.neg{border-color:rgba(255,90,90,.4)}

  /* 24h range bar */
  .range{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px}
  .range .track{position:relative;height:6px;border-radius:4px;background:linear-gradient(90deg,rgba(255,90,90,.35),rgba(242,193,78,.35),rgba(61,220,151,.35));margin:14px 4px 6px}
  .range .marker{position:absolute;top:-5px;width:2px;height:16px;background:var(--txt);border-radius:2px;transform:translateX(-1px)}
  .range .labels{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .range .cap{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}

  .stat-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-top:1px solid var(--line);padding-top:10px}
  .stat-row .k{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.5px;display:block}
  .stat-row .v{font-variant-numeric:tabular-nums;font-weight:600}
  .stat-row > div{min-width:0}

  /* Table */
  .table-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 4px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
  th{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;text-align:right;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th:nth-child(2),td:nth-child(2){text-align:left}
  td{padding:11px 14px;border-bottom:1px solid #1a2130;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--panel2)}
  td .nm{font-weight:600}
  td .sy{color:var(--faint);font-size:11.5px;margin-left:6px}
  .rank{color:var(--faint);font-size:12px}

  footer{margin-top:30px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Crypto <span>Market Board</span></h1>
      <div class="sub">Top 10 cryptocurrencies by market capitalization</div>
    </div>
    <div class="stamp">Data as of <b>2026-09-29</b> · CoinGecko</div>
  </header>
  <div class="rule"></div>

  <section class="summary" id="summary"></section>

  <h2 class="sec-title">Coin Cards</h2>
  <section class="cards" id="cards"></section>

  <h2 class="sec-title">Market Cap Ranking</h2>
  <section class="table-panel">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Coin</th><th>Price</th><th>24h</th><th>7d</th>
          <th>Volume 24h</th><th>Market Cap</th><th>vs ATH</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

  <footer>
    <span>Source: CoinGecko snapshot · static board, no live requests</span>
    <span>10 assets · rendered locally</span>
  </footer>
</div>

<script>
"use strict";
const DATA = {"as_of":"2026-09-29","coins":[
 {"id":"bitcoin","symbol":"BTC","name":"Bitcoin","current_price":84160,"market_cap":1691315724276,"total_volume":32045890569,"price_change_percentage_24h":0.48921,"price_change_percentage_7d_in_currency":null,"high_24h":84442,"low_24h":82721,"ath":126080,"ath_change_percentage":-33.24841},
 {"id":"ethereum","symbol":"ETH","name":"Ethereum","current_price":2727.16,"market_cap":333092519432,"total_volume":16303458670,"price_change_percentage_24h":1.15908,"price_change_percentage_7d_in_currency":null,"high_24h":2742.68,"low_24h":2652.36,"ath":4946.05,"ath_change_percentage":-44.86189},
 {"id":"tether","symbol":"USDT","name":"Tether","current_price":0.999818,"market_cap":183833179958,"total_volume":65356661374,"price_change_percentage_24h":0.00793,"price_change_percentage_7d_in_currency":null,"high_24h":0.999831,"low_24h":0.999634,"ath":1.32,"ath_change_percentage":-24.43344},
 {"id":"binancecoin","symbol":"BNB","name":"BNB","current_price":764.75,"market_cap":101881799194,"total_volume":938204356,"price_change_percentage_24h":-0.35734,"price_change_percentage_7d_in_currency":null,"high_24h":772.65,"low_24h":753.76,"ath":1369.99,"ath_change_percentage":-44.17848},
 {"id":"ripple","symbol":"XRP","name":"XRP","current_price":1.55,"market_cap":97318235362,"total_volume":3946512382,"price_change_percentage_24h":1.23722,"price_change_percentage_7d_in_currency":null,"high_24h":1.55,"low_24h":1.47,"ath":3.65,"ath_change_percentage":-57.58208},
 {"id":"usd-coin","symbol":"USDC","name":"USDC","current_price":0.999946,"market_cap":74709597006,"total_volume":20172326084,"price_change_percentage_24h":0.01186,"price_change_percentage_7d_in_currency":null,"high_24h":0.999992,"low_24h":0.999772,"ath":1.043,"ath_change_percentage":-4.17055},
 {"id":"solana","symbol":"SOL","name":"Solana","current_price":121.0,"market_cap":71166020345,"total_volume":3788473154,"price_change_percentage_24h":0.6824,"price_change_percentage_7d_in_currency":null,"high_24h":120.9,"low_24h":116.44,"ath":293.31,"ath_change_percentage":-58.74677},
 {"id":"tron","symbol":"TRX","name":"TRON","current_price":0.334914,"market_cap":31811952523,"total_volume":314505640,"price_change_percentage_24h":0.01475,"price_change_percentage_7d_in_currency":null,"high_24h":0.336428,"low_24h":0.333589,"ath":0.431288,"ath_change_percentage":-22.34573},
 {"id":"zcash","symbol":"ZEC","name":"Zcash","current_price":1443.33,"market_cap":24482632845,"total_volume":1530869939,"price_change_percentage_24h":-9.29783,"price_change_percentage_7d_in_currency":null,"high_24h":1586.43,"low_24h":1360.35,"ath":3191.93,"ath_change_percentage":-54.78192},
 {"id":"figure-heloc","symbol":"FIGR_HELOC","name":"Figure Heloc","current_price":1.003,"market_cap":23264202517,"total_volume":671576172,"price_change_percentage_24h":-4.50088,"price_change_percentage_7d_in_currency":null,"high_24h":1.061,"low_24h":1.002,"ath":1.062,"ath_change_percentage":-5.58927}
]};

const DASH = "\u2014";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmtUSD(v){
  if (v === null || v === undefined || isNaN(v)) return DASH;
  const a = Math.abs(v);
  if (a >= 1000) return "$" + v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  if (a >= 1)    return "$" + v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4});
  return "$" + v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:6});
}
function fmtCompact(v){
  if (v === null || v === undefined || isNaN(v)) return DASH;
  const a = Math.abs(v);
  if (a >= 1e12) return "$" + (v/1e12).toFixed(2) + "T";
  if (a >= 1e9)  return "$" + (v/1e9).toFixed(2) + "B";
  if (a >= 1e6)  return "$" + (v/1e6).toFixed(2) + "M";
  return "$" + v.toLocaleString("en-US");
}
function fmtPct(v){
  if (v === null || v === undefined || isNaN(v)) return DASH;
  return (v > 0 ? "+" : "") + v.toFixed(2) + "%";
}
function cls(v){ return (v === null || v === undefined || isNaN(v)) ? "nt" : (v >= 0 ? "pos" : "neg"); }
function pctOf(c){
  if (c === null || c === undefined || isNaN(c)) return DASH;
  return (c > 0 ? "+" : "") + c.toFixed(2) + "%";
}

/* ---- Summary strip ---- */
const coins = DATA.coins;
const totalCap = coins.reduce((s,c) => s + (c.market_cap || 0), 0);
const with24h = coins.filter(c => c.price_change_percentage_24h !== null && c.price_change_percentage_24h !== undefined);
let best = null, worst = null;
with24h.forEach(c => {
  if (!best  || c.price_change_percentage_24h >  best.price_change_percentage_24h)  best = c;
  if (!worst || c.price_change_percentage_24h < worst.price_change_percentage_24h) worst = c;
});
const adv = with24h.filter(c => c.price_change_percentage_24h >= 0).length;
const dec = with24h.length - adv;

document.getElementById("summary").innerHTML =
  '<div class="metric">' +
    '<div class="lbl">Total Market Cap &middot; Top 10</div>' +
    '<div class="num">' + fmtCompact(totalCap) + '</div>' +
    '<div class="note">Sum of 10 tracked assets</div>' +
  '</div>' +
  '<div class="metric">' +
    '<div class="lbl">Best 24h Performer</div>' +
    '<div class="num ' + (best ? cls(best.price_change_percentage_24h) : "nt") + '">' +
      (best ? esc(best.symbol) + " " + pctOf(best.price_change_percentage_24h) : DASH) + '</div>' +
    '<div class="note">' + (best ? esc(best.name) : "No 24h data") + '</div>' +
  '</div>' +
  '<div class="metric">' +
    '<div class="lbl">Worst 24h Performer</div>' +
    '<div class="num ' + (worst ? cls(worst.price_change_percentage_24h) : "nt") + '">' +
      (worst ? esc(worst.symbol) + " " + pctOf(worst.price_change_percentage_24h) : DASH) + '</div>' +
    '<div class="note">' + (worst ? esc(worst.name) : "No 24h data") + '</div>' +
  '</div>' +
  '<div class="metric">' +
    '<div class="lbl">Breadth &middot; 24h</div>' +
    '<div class="num"><span class="pos">' + adv + '</span> <span style="color:var(--faint)">/</span> <span class="neg">' + dec + '</span></div>' +
    '<div class="note">Advancers vs decliners</div>' +
  '</div>';

/* ---- Coin cards ---- */
function rangeBar(c){
  const lo = c.low_24h, hi = c.high_24h, p = c.current_price;
  if (lo === null || lo === undefined || hi === null || hi === undefined ||
      p === null || p === undefined || isNaN(lo) || isNaN(hi) || hi <= lo){
    return '<div class="range"><div class="cap">24h Range</div><div class="labels"><span>' + DASH + '</span><span>' + DASH + '</span></div></div>';
  }
  let pos = ((p - lo) / (hi - lo)) * 100;
  pos = Math.max(0, Math.min(100, pos));
  return '<div class="range">' +
    '<div class="cap">24h Range</div>' +
    '<div class="track"><div class="marker" style="left:' + pos.toFixed(2) + '%"></div></div>' +
    '<div class="labels"><span>L ' + fmtUSD(lo) + '</span><span>H ' + fmtUSD(hi) + '</span></div>' +
  '</div>';
}

document.getElementById("cards").innerHTML = coins.map(c => {
  const d24 = c.price_change_percentage_24h, d7 = c.price_change_percentage_7d_in_currency;
  const ath = c.ath_change_percentage;
  return '<article class="card">' +
    '<div class="card-top">' +
      '<div class="coin-id">' +
        '<div class="badge">' + esc(c.symbol.slice(0,5)) + '</div>' +
        '<div><div class="coin-name">' + esc(c.name) + '</div><div class="coin-sym">' + esc(c.symbol) + '</div></div>' +
      '</div>' +
      '<div class="price"><b>' + fmtUSD(c.current_price) + '</b><small>Price</small></div>' +
    '</div>' +
    '<div class="chg-row">' +
      '<span class="pill ' + cls(d24) + '"><span class="k">24h</span><b class="' + cls(d24) + '">' + pctOf(d24) + '</b></span>' +
      '<span class="pill ' + cls(d7) + '"><span class="k">7d</span><b class="' + cls(d7) + '">' + pctOf(d7) + '</b></span>' +
    '</div>' +
    rangeBar(c) +
    '<div class="stat-row">' +
      '<div><span class="k">Volume 24h</span><span class="v">' + fmtCompact(c.total_volume) + '</span></div>' +
      '<div><span class="k">Market Cap</span><span class="v">' + fmtCompact(c.market_cap) + '</span></div>' +
      '<div><span class="k">vs ATH</span><span class="v ' + cls(ath) + '">' + pctOf(ath) + '</span></div>' +
    '</div>' +
  '</article>';
}).join("");

/* ---- Table sorted by market cap ---- */
const sorted = coins.slice().sort((a,b) => (b.market_cap || 0) - (a.market_cap || 0));
document.getElementById("tbody").innerHTML = sorted.map((c,i) => {
  const d24 = c.price_change_percentage_24h, d7 = c.price_change_percentage_7d_in_currency;
  const ath = c.ath_change_percentage;
  return '<tr>' +
    '<td class="rank">' + (i+1) + '</td>' +
    '<td><span class="nm">' + esc(c.name) + '</span><span class="sy">' + esc(c.symbol) + '</span></td>' +
    '<td>' + fmtUSD(c.current_price) + '</td>' +
    '<td class="' + cls(d24) + '">' + pctOf(d24) + '</td>' +
    '<td class="' + cls(d7) + '">' + pctOf(d7) + '</td>' +
    '<td>' + fmtCompact(c.total_volume) + '</td>' +
    '<td>' + fmtCompact(c.market_cap) + '</td>' +
    '<td class="' + cls(ath) + '">' + pctOf(ath) + '</td>' +
  '</tr>';
}).join("");
</script>
</body>
</html>
