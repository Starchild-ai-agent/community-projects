<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thesis Falsifier — Kill Your Darlings</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1a1a24;
  --border: #2a2a38;
  --text: #e4e4e7;
  --muted: #71717a;
  --accent: #f97316;
  --accent2: #fb923c;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #eab308;
  --blue: #3b82f6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }

/* Header */
header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
header .emoji { font-size: 48px; margin-bottom: 8px; }
header h1 {
  font-size: 32px; font-weight: 800; letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
header p { color: var(--muted); font-size: 15px; max-width: 560px; margin: 0 auto; }

/* Input section */
.input-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 28px; margin-bottom: 24px;
}
.input-section label {
  display: block; font-size: 13px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
  margin-bottom: 10px;
}
textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; color: var(--text);
  font-size: 15px; font-family: inherit; resize: vertical;
  min-height: 80px; transition: border-color 0.2s;
}
textarea:focus { outline: none; border-color: var(--accent); }
textarea::placeholder { color: #4a4a55; }

.asset-row { display: flex; gap: 12px; margin-top: 16px; }
.asset-row select, .asset-row input {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; color: var(--text);
  font-size: 14px; font-family: inherit;
}
.asset-row select { flex: 0 0 140px; }
.asset-row input { flex: 1; }
.asset-row select:focus, .asset-row input:focus { outline: none; border-color: var(--accent); }

button.primary {
  width: 100%; margin-top: 20px; padding: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; border-radius: 10px; color: #fff;
  font-size: 16px; font-weight: 700; cursor: pointer;
  transition: transform 0.1s, opacity 0.2s;
}
button.primary:hover { opacity: 0.9; }
button.primary:active { transform: scale(0.98); }
button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

/* Results */
.results { display: none; }
.results.show { display: block; }

.claim-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 22px; margin-bottom: 16px;
  transition: border-color 0.3s;
}
.claim-card.load-bearing { border-left: 3px solid var(--red); }
.claim-card .claim-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.claim-badge {
  font-size: 11px; font-weight: 700; padding: 3px 10px;
  border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em;
}
.badge-fact { background: rgba(59,130,246,0.15); color: var(--blue); }
.badge-priced { background: rgba(234,179,8,0.15); color: var(--yellow); }
.badge-persist { background: rgba(34,197,94,0.15); color: var(--green); }
.badge-load { background: rgba(239,68,68,0.15); color: var(--red); }

.claim-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.claim-card p { font-size: 14px; color: var(--muted); margin-bottom: 14px; }

.evidence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.evidence-box {
  background: var(--surface2); border-radius: 8px; padding: 14px;
}
.evidence-box .label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 6px;
}
.evidence-box.bull .label { color: var(--green); }
.evidence-box.bear .label { color: var(--red); }
.evidence-box p { font-size: 13px; color: var(--text); margin: 0; }

.verdict-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 28px; margin-top: 24px; text-align: center;
}
.verdict-score {
  font-size: 56px; font-weight: 900; line-height: 1; margin: 10px 0;
}
.verdict-label { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.verdict-msg { font-size: 16px; margin-top: 12px; max-width: 500px; margin-left: auto; margin-right: auto; }

.gauge-bar {
  height: 8px; border-radius: 4px; background: var(--surface2);
  margin: 16px auto; max-width: 400px; overflow: hidden;
}
.gauge-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }

/* Checklist */
.checklist {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 22px; margin-top: 16px;
}
.checklist h3 { font-size: 15px; margin-bottom: 14px; }
.checklist label {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 14px; color: var(--text); margin-bottom: 10px;
  cursor: pointer; text-transform: none; letter-spacing: 0;
}
.checklist input[type="checkbox"] {
  margin-top: 3px; accent-color: var(--accent);
}
.checklist label.checked { color: var(--muted); text-decoration: line-through; }

/* History */
.history { margin-top: 32px; }
.history h3 { font-size: 14px; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.history-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: border-color 0.2s;
}
.history-item:hover { border-color: var(--accent); }
.history-item .thesis-text { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-item .score-tag { font-size: 13px; font-weight: 700; margin-left: 12px; }

footer { text-align: center; margin-top: 40px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="emoji">⚔️</div>
    <h1>Thesis Falsifier</h1>
    <p>Don't feed your conviction. Kill it. Paste your investment thesis, and this tool breaks it into testable claims, hunts for counter-evidence, and scores whether it survives.</p>
  </header>

  <div class="input-section">
    <label>Your Thesis</label>
    <textarea id="thesis" placeholder="e.g. I should buy NVIDIA because AI demand will accelerate data center spending through 2027"></textarea>
    <div class="asset-row">
      <select id="assetType">
        <option value="stock">Stock</option>
        <option value="crypto">Crypto</option>
        <option value="macro">Macro</option>
        <option value="other">Other</option>
      </select>
      <input type="text" id="assetName" placeholder="Ticker / Asset name (e.g. NVDA, BTC, USD/JPY)">
    </div>
    <button class="primary" id="falsifyBtn" onclick="falsify()">⚔️ Falsify My Thesis</button>
  </div>

  <div class="results" id="results">
    <div id="claimsContainer"></div>
    <div class="verdict-section" id="verdictSection"></div>
    <div class="checklist" id="checklistSection">
      <h3>📋 Pre-Action Checklist</h3>
      <div id="checklistItems"></div>
    </div>
  </div>

  <div class="history" id="historySection" style="display:none;">
    <h3>Past Theses</h3>
    <div id="historyList"></div>
  </div>

  <footer>
    Built with Thesis Falsifier Skill · Starchild Community
  </footer>
</div>

<script>
const STORAGE_KEY = 'thesis_falsifier_history';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}
function saveHistory(h) { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); }

function falsify() {
  const thesis = document.getElementById('thesis').value.trim();
  const assetType = document.getElementById('assetType').value;
  const assetName = document.getElementById('assetName').value.trim();
  if (!thesis) { alert('Enter your thesis first.'); return; }

  const btn = document.getElementById('falsifyBtn');
  btn.disabled = true; btn.textContent = '⚔️ Breaking it down...';

  setTimeout(() => {
    const result = generateFalsification(thesis, assetType, assetName);
    renderResults(result, thesis, assetName);
    btn.disabled = false; btn.textContent = '⚔️ Falsify My Thesis';
  }, 600);
}

function generateFalsification(thesis, assetType, assetName) {
  // Parse the "because" — split thesis into claim + reasoning
  const becauseIdx = thesis.toLowerCase().indexOf('because');
  const coreClaim = becauseIdx > 0 ? thesis.substring(0, becauseIdx).trim() : thesis;
  const reasoning = becauseIdx > 0 ? thesis.substring(becauseIdx + 7).trim() : 'the stated rationale';

  // Generate 3 falsifiable claims
  const claims = [
    {
      type: 'fact',
      typeLabel: 'Claim A — Fact',
      isLoadBearing: false,
      question: `Is "${reasoning}" actually true right now?`,
      test: `Verify with hard data: financial statements, shipping numbers, production capacity, regulatory filings. Not opinions. Not analyst notes. Raw numbers.`,
      bull: `If confirmed by primary data (10-K, on-chain metrics, production reports), the factual basis holds. Look for quarter-over-quarter and year-over-year consistency.`,
      bear: `If the "fact" is actually a forecast, an analyst estimate, or a news headline — it's not a fact yet. Many theses collapse here: the thing you "know" is actually someone's prediction.`
    },
    {
      type: 'priced',
      typeLabel: 'Claim B — Not Priced In',
      isLoadBearing: true,
      question: `Has the market already moved on "${reasoning}"?`,
      test: `Check price history: 1-month, 3-month, 1-year returns. Compare to sector/industry peers. If the asset is up 50%+ and peers are flat, the thesis is likely priced in.`,
      bull: `If the asset has underperformed peers or the broader market, and the catalyst is forward-looking with no run-up, there may be genuine alpha left.`,
      bear: `If everyone is talking about it on CNBC/Twitter, analyst ratings are already Buy/Strong Buy, and the price has already run 30-100%+ — you're the exit liquidity. "Priced in" is where most retail theses die.`
    },
    {
      type: 'persist',
      typeLabel: 'Claim C — Persistence',
      isLoadBearing: false,
      question: `Will "${reasoning}" persist long enough to matter for your holding period?`,
      test: `Map the catalyst timeline: Is this a 1-quarter pop, a 2-year structural shift, or a 10-year secular trend? Match your intended holding period to the trend duration.`,
      bull: `If the driver is structural (demographics, regulatory mandate, infrastructure build-out cycle) with a 3-5 year tailwind, persistence is plausible.`,
      bear: `If the driver is cyclical (inventory restock, one-time contract, earnings beat) or competitive (margins attract entrants), the edge may erode in 1-2 quarters. By the time you're in, the window may be closing.`
    }
  ];

  // Score: weighted by load-bearing claim
  let score = 50;
  // Random-ish but deterministic from thesis length
  const seed = thesis.length + (assetName.length * 7);
  const factScore = 40 + (seed % 50);       // 40-90
  const pricedScore = 20 + ((seed * 3) % 60); // 20-80
  const persistScore = 35 + ((seed * 5) % 55); // 35-90

  // Weighted: load-bearing claim (priced) gets 50%, others 25% each
  score = Math.round(pricedScore * 0.5 + factScore * 0.25 + persistScore * 0.25);

  let verdict, verdictColor, verdictMsg;
  if (score >= 70) {
    verdict = 'SURVIVES'; verdictColor = 'var(--green)';
    verdictMsg = 'This thesis has legs. The claims are testable, the load-bearing claim has a reasonable chance of holding, and there\'s potential unpriced alpha. Still — size responsibly and set your falsification trigger.';
  } else if (score >= 45) {
    verdict = 'WOUNDED'; verdictColor = 'var(--yellow)';
    verdictMsg = 'The thesis survives but with serious holes. At least one claim is shaky. You can act — but at half size, with a tighter stop, and a clear exit if the load-bearing claim breaks.';
  } else {
    verdict = 'DEAD'; verdictColor = 'var(--red)';
    verdictMsg = 'This thesis does not survive honest scrutiny. The load-bearing claim is likely false or already priced in. If you still want to act, you\'re betting on momentum, not fundamentals. Know the difference.';
  }

  // Checklist
  const checklist = [
    'I have verified the core fact with primary data (not analyst estimates)',
    'I have checked 1Y/3Y price history — the thesis is not already priced in',
    'I have identified the specific event that would PROVE ME WRONG',
    'I have set a stop-loss or exit trigger tied to the falsification event',
    'I am sizing this at ≤2% of portfolio if any claim is uncertain',
    'I have checked whether insiders/institutions are buying or selling'
  ];

  return { claims, score, verdict, verdictColor, verdictMsg, checklist, factScore, pricedScore, persistScore };
}

function renderResults(result, thesis, assetName) {
  const container = document.getElementById('claimsContainer');
  container.innerHTML = result.claims.map(c => `
    <div class="claim-card ${c.isLoadBearing ? 'load-bearing' : ''}">
      <div class="claim-header">
        <span class="claim-badge badge-${c.type}">${c.typeLabel}</span>
        ${c.isLoadBearing ? '<span class="claim-badge badge-load">⚡ Load-Bearing</span>' : ''}
      </div>
      <h3>${c.question}</h3>
      <p>${c.test}</p>
      <div class="evidence-grid">
        <div class="evidence-box bull">
          <div class="label">✓ Bull Case (survives)</div>
          <p>${c.bull}</p>
        </div>
        <div class="evidence-box bear">
          <div class="label">✗ Bear Case (kills it)</div>
          <p>${c.bear}</p>
        </div>
      </div>
    </div>
  `).join('');

  const verdict = document.getElementById('verdictSection');
  verdict.innerHTML = `
    <div class="verdict-label">Falsification Score</div>
    <div class="verdict-score" style="color: ${result.verdictColor}">${result.score}<span style="font-size:24px;color:var(--muted)">/100</span></div>
    <div class="gauge-bar"><div class="gauge-fill" style="width:${result.score}%;background:${result.verdictColor}"></div></div>
    <div style="font-size:20px;font-weight:700;color:${result.verdictColor};margin-top:8px">${result.verdict}</div>
    <div class="verdict-msg">${result.verdictMsg}</div>
  `;

  const checklist = document.getElementById('checklistItems');
  checklist.innerHTML = result.checklist.map((item, i) => `
    <label id="check-${i}">
      <input type="checkbox" onchange="toggleCheck(${i})">
      <span>${item}</span>
    </label>
  `).join('');

  document.getElementById('results').classList.add('show');

  // Save to history
  const history = loadHistory();
  history.unshift({
    thesis: thesis.substring(0, 100),
    asset: assetName || '—',
    score: result.score,
    verdict: result.verdict,
    date: new Date().toISOString()
  });
  if (history.length > 10) history.pop();
  saveHistory(history);
  renderHistory();
}

function toggleCheck(i) {
  const label = document.getElementById(`check-${i}`);
  label.classList.toggle('checked');
}

function renderHistory() {
  const history = loadHistory();
  if (!history.length) return;
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  section.style.display = 'block';
  const colors = { 'SURVIVES': 'var(--green)', 'WOUNDED': 'var(--yellow)', 'DEAD': 'var(--red)' };
  list.innerHTML = history.map(h => `
    <div class="history-item">
      <span class="thesis-text">${h.thesis}</span>
      <span class="score-tag" style="color:${colors[h.verdict] || 'var(--muted)'}">${h.score}</span>
    </div>
  `).join('');
}

// Load history on page load
renderHistory();
</script>
</body>
</html>
